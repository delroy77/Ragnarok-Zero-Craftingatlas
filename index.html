<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crafting-Atlas – Ragnarok Online</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f8;--s1:#fff;--s2:#e6eaf4;--ln:#d3d9e8;--tx:#17203a;--mut:#5d6786;--ac:#b8780a;--ac2:#0f8f86;--acbg:#f6e6c4;--ok:#127a4c;--bad:#c0392b;--tl:34%;--sh:0 8px 28px rgba(30,40,80,.12);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1320;--s1:#161d30;--s2:#1f2840;--ln:#2b3652;--tx:#e6ecfb;--mut:#93a0c4;--ac:#f2b84b;--ac2:#5fd0c4;--acbg:#3a2d12;--ok:#5fd6a0;--bad:#ff8a7a;--tl:72%;--sh:0 10px 34px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1320;--s1:#161d30;--s2:#1f2840;--ln:#2b3652;--tx:#e6ecfb;--mut:#93a0c4;--ac:#f2b84b;--ac2:#5fd0c4;--acbg:#3a2d12;--ok:#5fd6a0;--bad:#ff8a7a;--tl:72%;--sh:0 10px 34px rgba(0,0,0,.45);color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.logo{width:46px;height:46px;border-radius:13px;background:linear-gradient(135deg,var(--ac),#e5622e);display:grid;place-items:center;font-size:24px;flex:none}
h1{font:700 26px/1.1 Sora,system-ui,sans-serif;margin:0;letter-spacing:-.02em}
.hd p{margin:2px 0 0;color:var(--mut);font-size:14px}
.sp{flex:1}
.ib{background:var(--s1);border:1px solid var(--ln);border-radius:10px;width:40px;height:40px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:20px}
.k{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px 16px}
.k b{display:block;font:700 28px/1.1 Sora,system-ui,sans-serif;color:var(--ac)}
.k span{color:var(--mut);font-size:13px}
.sb{position:relative;margin-bottom:14px}
.sb input{width:100%;height:56px;border-radius:16px;border:1.5px solid var(--ln);background:var(--s1);color:var(--tx);font:inherit;font-size:17px;padding:0 90px 0 52px;box-shadow:var(--sh)}
.sb input:focus{outline:none;border-color:var(--ac2)}
.sb .ic{position:absolute;left:18px;top:15px;font-size:20px;opacity:.7}
.sb kbd{position:absolute;right:16px;top:16px;border:1px solid var(--ln);border-radius:6px;padding:0 8px;color:var(--mut);font-size:13px;line-height:22px}
.sb .x{position:absolute;right:10px;top:10px;border:0;background:var(--s2);border-radius:8px;width:36px;height:36px;display:none}
.sb.has kbd{display:none}.sb.has .x{display:block}
.fl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.ch{border:1px solid var(--ln);background:var(--s1);border-radius:999px;padding:6px 14px;font-size:14px}
.ch i{font-style:normal;color:var(--mut);margin-left:6px;font-size:12px}
.ch[aria-pressed=true]{background:var(--acbg);border-color:var(--ac);color:var(--ac)}
.ch[aria-pressed=true] i{color:inherit}
.cnt{color:var(--mut);font-size:13px;margin:14px 2px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{text-align:left;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px;min-height:112px;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--ac2)}
.card.on{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.card h3{margin:10px 0 4px;font:600 16px/1.25 Sora,system-ui,sans-serif}
.card p{margin:0;color:var(--mut);font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center}
.tag{font-size:12px;border-radius:7px;padding:2px 8px;background:hsl(var(--h) 60% 50%/.16);color:hsl(var(--h) 70% var(--tl))}
.lv{font-size:12px;color:var(--mut)}
mark{background:var(--acbg);color:var(--ac);border-radius:3px;padding:0 1px}
.empty{grid-column:1/-1;text-align:center;color:var(--mut);padding:50px 10px;border:1px dashed var(--ln);border-radius:14px}
.scr{position:fixed;inset:0;background:rgba(5,8,18,.55);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scr.open{opacity:1;pointer-events:auto}
.pn{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--ln);z-index:30;transform:translateX(100%);transition:transform .22s;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(30px + env(safe-area-inset-bottom,0px));box-shadow:var(--sh)}
.pn.open{transform:none}
.pn h2{font:700 24px/1.2 Sora,system-ui,sans-serif;margin:10px 0 4px;letter-spacing:-.01em}
.pn h4{margin:22px 0 8px;font:600 15px Sora,system-ui,sans-serif}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;border:1px solid var(--ln);border-radius:10px;background:var(--s1);overflow:hidden}
.step button{border:0;background:none;width:38px;height:38px;font-size:18px}
.step input{width:70px;height:38px;border:0;border-inline:1px solid var(--ln);background:none;color:var(--tx);text-align:center;font:inherit}
.q{border:1px solid var(--ln);background:var(--s1);border-radius:8px;padding:5px 10px;font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--s1);border:1px solid var(--ln);border-radius:12px;overflow:hidden}
th{font-weight:500;color:var(--mut);font-size:12px;text-align:left;padding:8px 12px;background:var(--s2)}
td{padding:9px 12px;border-top:1px solid var(--ln)}
.num{text-align:right;font-variant-numeric:tabular-nums}th.num{text-align:right}
.lnk{border:0;background:none;color:var(--ac2);padding:0;text-decoration:underline;text-underline-offset:3px}
.box{background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:14px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.pri{background:linear-gradient(135deg,var(--ac),#e5622e);color:#1b1305;border:0;border-radius:10px;padding:9px 16px;font-weight:600;margin-top:14px}
.cl{float:right}
.tst{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:10px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
.tst.on{opacity:1}
.ft{margin-top:36px;color:var(--mut);font-size:13px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="fl" id="cats"></div>

  <div class="cnt" id="cnt"></div>

</div>

const CATS=[
 {s:"Blacksmith",i:"⚒️",h:32},{s:"Alchemist",i:"⚗️",h:280},{s:"Pfeile",i:"🏹",h:150},{s:"Kochen",i:"🍳",h:12},{s:"Sonstiges",i:"✨",h:200}];
const R=D.r,ARROW=2;
const ELS=[["kein Element","",""],["Feuer","Flame Heart","Fire"],["Wasser","Mystic Frozen","Water"],["Wind","Rough Wind","Wind"],["Erde","Great Nature","Earth"]];
const REF=["Keine","Very Strong","Very Very Strong","Very Very Very Strong"],BON=["–","+5","+10","+40"];
const HAM=["","Iron Hammer","Golden Hammer","Oridecon Hammer"];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const f=n=>n.toLocaleString("de-DE");
const names=Object.keys(R).sort((a,b)=>a.localeCompare(b));
const U={};for(const n of names)for(const[m,q]of R[n][2])(U[m]=U[m]||[]).push([n,q]);
const S={q:"",cat:-1,lvl:0,sel:null,n:1,ref:0,el:0};
const hl=t=>{const q=S.q.trim(),i=q?t.toLowerCase().indexOf(q.toLowerCase()):-1;return i<0?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))};
function match(n){const r=R[n],q=S.q.trim().toLowerCase();
 if(S.cat>=0&&r[0]!==S.cat)return null;if(S.lvl&&r[1]!==S.lvl)return null;
 if(!q)return{s:3};const l=n.toLowerCase();
 if(l.startsWith(q))return{s:0};if(l.includes(q))return{s:1};
 const m=r[2].find(x=>x[0].toLowerCase().includes(q));return m?{s:2,via:m[0]}:null}
function kpis(){const mats=Object.keys(U),top=mats.sort((a,b)=>U[b].length-U[a].length)[0];
 const k=[[names.length,"Rezepte"],[mats.length,"verschiedene Materialien"],[mats.filter(m=>R[m]).length,"Materialien, die du selbst herstellst"],[top,"meistgenutztes Material ("+U[top].length+" Rezepte)"]];
 $("#kp").innerHTML=k.map(([a,b])=>`<div class="k"><b>${esc(a)}</b><span>${b}</span></div>`).join("")}
function chips(){
 const c=[-1,0,1,2,3,4].map(i=>{const n=i<0?names.length:names.filter(x=>R[x][0]===i).length;
  return`<button class="ch" aria-pressed="${S.cat===i}" data-cat="${i}">${i<0?"Alle":CATS[i].i+" "+CATS[i].s}<i>${n}</i></button>`}).join("");
 $("#cats").innerHTML=c;
 $("#lvls").innerHTML=S.cat===0?`<span class="lv">Waffenlevel</span>`+[0,1,2,3].map(l=>`<button class="ch" aria-pressed="${S.lvl===l}" data-lvl="${l}">${l?"Level "+l:"Alle"}</button>`).join(""):""}
const card=(n,m)=>{const r=R[n],c=CATS[r[0]];
 return`<button class="card${S.sel===n?" on":""}" data-n="${esc(n)}"><div class="top"><span class="tag" style="--h:${c.h}">${c.i} ${c.s}</span>${r[1]?`<span class="lv">Level ${r[1]}</span>`:""}</div><h3>${hl(n)}</h3><p>${m.via?`enthält <b>${hl(m.via)}</b>`:r[2].slice(0,3).map(x=>esc(x[0])).join(", ")+(r[2].length>3?" …":"")}</p></button>`};
function list(){
 const res=names.map(n=>[n,match(n)]).filter(x=>x[1]).sort((a,b)=>a[1].s-b[1].s||a[0].localeCompare(b[0]));
 $("#cnt").textContent=res.length+" von "+names.length+" Rezepten";
 $("#grid").innerHTML=res.length?res.map(x=>card(x[0],x[1])).join(""):`<div class="empty">Kein Treffer für „${esc(S.q)}“. Prüfe die Schreibweise oder suche nach einem Material.</div>`;
 $("#sb").classList.toggle("has",!!S.q)}
function detail(){
 const p=$("#pn"),n=S.sel;
 document.body.classList.toggle("lock",!!n);p.classList.toggle("open",!!n);$("#scr").classList.toggle("open",!!n);

 const r=R[n],c=CATS[r[0]],ar=r[0]===ARROW,bs=r[1]>0,N=S.n,L=[];

 let ex="",info="";
 if(bs){const e=ELS[S.el],sc=S.ref,sl=sc+(S.el?1:0),bad=sc===3&&S.el;
  const xr=[];if(sc)xr.push(["Star Crumb",sc]);if(S.el)xr.push([e[1],1]);xr.push([HAM[r[1]],1]);
  ex=xr.map(([m,q])=>{L.push(m+": "+q*N);return`<tr><td>${esc(m)}</td><td class="num">${q}</td><td class="num"><b>${f(q*N)}</b></td></tr>`}).join("")+`<tr><td>Anvil (wird nicht verbraucht)</td><td class="num">1</td><td class="num">1</td></tr>`;

  info=`<h4>Veredelung und Element</h4>

  <div class="row" style="margin-top:8px">${ELS.map((x,i)=>`<button class="ch" aria-pressed="${S.el===i}" data-act="el" data-v="${i}">${x[0]}</button>`).join("")}</div>
  <div class="box"><div>Ergebnis: <b>${esc(nm)}</b></div><div>Bonus: ${BON[sc]} Mastery-ATK</div>
  <div class="${bad?"bad":"ok"}">${bad?"3 Star Crumbs plus Elementstein ergeben 4 Slots. Das geht nicht.":sl+" von 3 Slots belegt"}</div>
  <div>Ranking-Punkte beim Schmieden: <b>${r[1]===3&&sl===3&&!bad?10*N:0}</b>${r[1]===3?"":" (nur Level-3-Waffen mit 3 belegten Slots zählen)"}</div></div>`}
 const used=(U[n]||[]).map(([x])=>`<button class="ch" data-n="${esc(x)}">${esc(x)}</button>`).join("");
 const qk=(ar?[100,500,1000,5000]:[1,5,10,50,100]).map(v=>`<button class="q" data-act="qn" data-v="${v}">${f(v)}</button>`).join("");
 $("#pn").innerHTML=`<button class="ib cl" data-act="close" aria-label="Schließen">✕</button>
 <span class="tag" style="--h:${c.h}">${c.i} ${c.s}</span>${bs?` <span class="lv">Waffenlevel ${r[1]}, ${HAM[r[1]]}</span>`:""}
 <h2>${esc(n)}</h2>
 <div class="row"><span class="lv">${ar?"Gewünschte Pfeile":"Anzahl Crafts"}</span>
  <span class="step"><button data-act="dec" aria-label="weniger">−</button><input id="nn" type="number" min="1" value="${N}" aria-label="Menge"><button data-act="inc" aria-label="mehr">+</button></span>${qk}</div>
 ${info}
 <h4>${ar?"Material (eine Sorte genügt)":"Benötigte Materialien"}</h4>
 <table><thead><tr><th>Material</th><th class="num">${ar?"Pfeile je Stück":"je Craft"}</th><th class="num">Gesamt</th></tr></thead><tbody>${rows}${ex}</tbody></table>
 <button class="pri" data-act="copy" data-l="${esc(L.join("\n"))}">Einkaufsliste kopieren</button>
 ${used?`<h4>Wird benötigt für</h4><div class="row">${used}</div>`:""}`;
 p.scrollTop=0}
function toast(t){const e=$("#tst");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)}
function open(n,t){S.sel=n;S.n=t||(R[n][0]===ARROW?100:1);S.ref=0;S.el=0;list();detail()}
function keepScroll(){const p=$("#pn"),y=p.scrollTop;detail();p.scrollTop=y}
document.addEventListener("click",e=>{
 const t=e.target.closest("[data-n],[data-act],[data-cat],[data-lvl]");if(!t)return;const d=t.dataset;
 if(d.n!==undefined){open(d.n,d.t?+d.t:0);return}
 if(d.cat!==undefined){S.cat=+d.cat;S.lvl=0;chips();list();return}
 if(d.lvl!==undefined){S.lvl=+d.lvl;chips();list();return}
 const a=d.act;
 if(a==="close"){S.sel=null;list();detail()}
 else if(a==="clr"){S.q="";$("#q").value="";list();$("#q").focus()}
 else if(a==="inc"){S.n++;keepScroll()}
 else if(a==="dec"){S.n=Math.max(1,S.n-1);keepScroll()}
 else if(a==="qn"){S.n=+d.v;keepScroll()}
 else if(a==="ref"){S.ref=+d.v;keepScroll()}
 else if(a==="el"){S.el=+d.v;keepScroll()}
 else if(a==="copy"){const x=d.l;(navigator.clipboard?navigator.clipboard.writeText(x):Promise.reject()).then(()=>toast("Einkaufsliste kopiert"),()=>toast("Kopieren nicht möglich"))}
 else if(a==="theme"){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"}
});
document.addEventListener("change",e=>{if(e.target.id==="nn"){S.n=Math.max(1,parseInt(e.target.value)||1);keepScroll()}});
$("#q").addEventListener("input",e=>{S.q=e.target.value;list()});
document.addEventListener("keydown",e=>{
 if(e.key==="/"&&document.activeElement.tagName!=="INPUT"){e.preventDefault();$("#q").focus()}
 else if(e.key==="Escape"){if(S.sel){S.sel=null;list();detail()}else if(S.q){S.q="";$("#q").value="";list()}}});
kpis();chips();list();
</script>
